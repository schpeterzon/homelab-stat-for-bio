# Output target for the schpeterzon GitHub profile repository.
repository_path: ../schpeterzon
template: templates/profile.README.md.tmpl
profile: profile.json
readme: README.md
status_file: status.json
# Theme-aware cards are written as assets/<card>-{dark,light}.svg.
assets_dir: assets
collectors:
  kubernetes: true
  docker: true
  proxmox: false
publish:
  enabled: true
  remote: origin
  branch: main
  message: "chore: update homelab status"
